const W=256,H=144,N=20,FRAME_MS=250;
const players=[];document.getElementById('count').textContent=CASES.length;
const loop=()=>document.getElementById('loop').checked;
function decodeImage(url){return new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=()=>reject(Error('像素图片读取失败'));im.src=url;});}
class PixelPlayer{
 constructor(c){
  this.id=c.id;this.case=c;this.frame=0;this.playing=false;this.wantsPlay=false;this.loading=false;this.frames=null;this.promise=null;this.raf=null;this.start=0;
  const el=document.createElement('article');el.className='card';el.dataset.case=c.id;
  el.innerHTML='<div class="heading"><span class="ident"></span><h2></h2></div><div class="screen" role="button" tabindex="0"><canvas width="256" height="144"></canvas><img class="poster" alt=""><div class="overlay"><span class="big-play">▶</span></div></div><div class="controls"><div class="buttons"><button class="play primary">▶ 播放</button><button class="replay">↻ 重播</button><span class="clock">0.00 / 5.00 s</span></div><input class="seek" type="range" min="0" max="19" value="0" step="1"><div class="meta"><span class="state">未播放</span><a target="_blank" rel="noopener">生成方法 ↗</a></div></div>';
  this.el=el;this.canvas=el.querySelector('canvas');this.ctx=this.canvas.getContext('2d',{willReadFrequently:true});this.ctx.imageSmoothingEnabled=false;this.image=this.ctx.createImageData(W,H);
  this.poster=el.querySelector('.poster');this.poster.src=c.poster;
  el.querySelector('.ident').textContent=c.id;el.querySelector('h2').textContent=c.title;el.querySelector('.meta a').href=c.method;
  this.button=el.querySelector('.play');this.seek=el.querySelector('.seek');this.clock=el.querySelector('.clock');this.state=el.querySelector('.state');this.overlay=el.querySelector('.overlay');this.overlayText=el.querySelector('.big-play');
  const screen=el.querySelector('.screen');screen.setAttribute('aria-label','播放 '+c.title);this.seek.setAttribute('aria-label',c.title+' 播放进度');
  this.button.onclick=()=>this.toggle();screen.onclick=()=>this.toggle();screen.onkeydown=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();this.toggle();}};
  el.querySelector('.replay').onclick=()=>this.replay();
  this.seek.oninput=()=>{const f=+this.seek.value;this.pause();this.frame=f;this.update();this.ensure().then(()=>this.draw(this.frame)).catch(()=>{});};
  document.getElementById('grid').appendChild(el);
 }
 status(message,error=false){this.state.textContent=message;this.state.classList.toggle('error',error);}
 update(){this.seek.value=this.frame;this.clock.textContent=(this.frame/4).toFixed(2)+' / 5.00 s';this.button.textContent=this.wantsPlay?'❚❚ 暂停':'▶ 播放';this.overlay.hidden=this.playing;this.overlay.classList.toggle('loading',this.loading);this.overlayText.textContent=this.loading?'加载像素…':'▶';}
 async readAsset(){
  if(INLINE[this.id])return decodeImage(INLINE[this.id]);
  const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),45000);let url;
  try{
   const response=await fetch(this.case.asset,{signal:controller.signal});if(!response.ok)throw Error('网络响应 '+response.status);
   const total=Number(response.headers.get('content-length'))||this.case.bytes;
   let blob;
   if(response.body&&response.body.getReader){const reader=response.body.getReader(),chunks=[];let received=0;while(true){const {done,value}=await reader.read();if(done)break;chunks.push(value);received+=value.length;this.status('加载 '+Math.min(99,Math.round(received/total*100))+'%');}blob=new Blob(chunks,{type:'image/png'});}
   else blob=await response.blob();
   url=URL.createObjectURL(blob);return await decodeImage(url);
  }finally{clearTimeout(timeout);if(url)URL.revokeObjectURL(url);}
 }
 ensure(){
  if(this.frames)return Promise.resolve();if(this.promise)return this.promise;
  this.loading=true;this.status('加载像素…');this.update();
  this.promise=(async()=>{
   const image=await this.readAsset();if(image.naturalWidth!==W||image.naturalHeight!==H*N)throw Error('像素数据尺寸错误');
   const scratch=document.createElement('canvas');scratch.width=W;scratch.height=H*N;const ctx=scratch.getContext('2d',{willReadFrequently:true});ctx.drawImage(image,0,0);
   const rgba=ctx.getImageData(0,0,W,H*N).data;this.frames=[];
   const size=W*H*4;
   for(let n=0;n<N;n++){const pixels=new Uint8ClampedArray(size);const offset=n*size;const prev=n?this.frames[n-1]:null;for(let j=0;j<size;j+=4){pixels[j]=rgba[offset+j]^(prev?prev[j]:0);pixels[j+1]=rgba[offset+j+1]^(prev?prev[j+1]:0);pixels[j+2]=rgba[offset+j+2]^(prev?prev[j+2]:0);pixels[j+3]=255;}this.frames.push(pixels);}
   this.loading=false;this.draw(this.frame);this.status('已加载 · 20 帧');this.update();
  })().catch(e=>{this.loading=false;this.wantsPlay=false;this.promise=null;this.frames=null;this.status('加载失败，点播放重试',true);this.update();throw e;});
  return this.promise;

 draw(n){this.frame=Math.max(0,Math.min(N-1,n));if(this.frames){this.image.data.set(this.frames[this.frame]);this.ctx.putImageData(this.image,0,0);this.poster.hidden=true;}this.update();}
 toggle(){if(this.wantsPlay||this.playing)this.pause();else this.play();}
 async play(){
  if(this.wantsPlay)return;this.wantsPlay=true;this.update();
  try{await this.ensure();}catch(e){return;}
  if(!this.wantsPlay)return;if(this.frame===N-1)this.draw(0);
  this.playing=true;this.start=performance.now()-this.frame*FRAME_MS;this.status('播放中');this.update();this.tick();
 }
 tick(){
  if(!this.playing)return;const elapsed=performance.now()-this.start;
  if(elapsed>=N*FRAME_MS){if(loop()){this.start=performance.now();this.draw(0);}else{this.draw(N-1);this.pause();this.clock.textContent='5.00 / 5.00 s';this.status('播放结束');return;}}
  else this.draw(Math.floor(elapsed/FRAME_MS));
  this.raf=requestAnimationFrame(()=>this.tick());

 pause(){this.wantsPlay=false;this.playing=false;if(this.raf!==null)cancelAnimationFrame(this.raf);this.raf=null;if(this.frames)this.status('已暂停');this.update();}

}
for(const c of CASES)players.push(new PixelPlayer(c));
document.getElementById('play-all').onclick=()=>players.forEach(p=>p.play());
document.getElementById('pause-all').onclick=()=>players.forEach(p=>p.pause());
document.getElementById('reset-all').onclick=()=>players.forEach(p=>p.replay());
document.addEventListener('visibilitychange',()=>{if(document.hidden)players.forEach(p=>p.pause());});
window.__pixelPlayers=players;window.__pixelReady=true;window.__caseCount=players.length;
