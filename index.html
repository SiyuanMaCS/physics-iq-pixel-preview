   const image=await this.readAsset();if(image.naturalWidth!==W||image.naturalHeight!==H*N)throw Error('像素数据尺寸错误');
   const scratch=document.createElement('canvas');scratch.width=W;scratch.height=H*N;const ctx=scratch.getContext('2d',{willReadFrequently:true});ctx.drawImage(image,0,0);
   const rgba=ctx.getImageData(0,0,W,H*N).data;this.frames=[];
   const size=W*H*4;
   for(let n=0;n<N;n++){const pixels=new Uint8ClampedArray(size);const offset=n*size;const prev=n?this.frames[n-1]:null;for(let j=0;j<size;j+=4){pixels[j]=rgba[offset+j]^(prev?prev[j]:0);pixels[j+1]=rgba[offset+j+1]^(prev?prev[j+1]:0);pixels[j+2]=rgba[offset+j+2]^(prev?prev[j+2]:0);pixels[j+3]=255;}this.frames.push(pixels);}
   this.loading=false;this.draw(this.frame);this.status('已加载 · 20 帧');this.update();
  })().catch(e=>{this.loading=false;this.wantsPlay=false;this.promise=null;this.frames=null;this.status('加载失败，点播放重试',true);this.update();throw e;});
  return this.promise;
 }
 draw(n){this.frame=Math.max(0,Math.min(N-1,n));if(this.frames){this.image.data.set(this.frames[this.frame]);this.ctx.putImageData(this.image,0,0);this.poster.hidden=true;}this.update();}
 toggle(){if(this.wantsPlay||this.playing)this.pause();else this.play();}
 async play(){
  if(this.wantsPlay)return;this.wantsPlay=true;this.update();
  try{await this.ensure();}catch(e){return;}
  if(!this.wantsPlay)return;if(this.frame===N-1)this.draw(0);
  this.playing=true;this.start=performance.now()-this.frame*FRAME_MS;this.status('播放中');this.update();this.tick();
 }
 tick(){
  if(!this.playing)return;const elapsed=performance.now()-this.start;
  if(elapsed>=N*FRAME_MS){if(loop()){this.start=performance.now();this.draw(0);}else{this.draw(N-1);this.pause();this.clock.textContent='5.00 / 5.00 s';this.status('播放结束');return;}}
  else this.draw(Math.floor(elapsed/FRAME_MS));
  this.raf=requestAnimationFrame(()=>this.tick());
 }
 pause(){this.wantsPlay=false;this.playing=false;if(this.raf!==null)cancelAnimationFrame(this.raf);this.raf=null;if(this.frames)this.status('已暂停');this.update();}
 replay(){this.pause();this.draw(0);this.play();}
}
for(const c of CASES)players.push(new PixelPlayer(c));
document.getElementById('play-all').onclick=()=>players.forEach(p=>p.play());
document.getElementById('pause-all').onclick=()=>players.forEach(p=>p.pause());
document.getElementById('reset-all').onclick=()=>players.forEach(p=>p.replay());
document.addEventListener('visibilitychange',()=>{if(document.hidden)players.forEach(p=>p.pause());});
window.__pixelPlayers=players;window.__pixelReady=true;window.__caseCount=players.length;
</script></body></html>
